name: PR Build Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  LIB_NAME: sddc

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # -------- Windows --------
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc

          # -------- Linux --------
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_ext: so

          # -------- macOS --------
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: |
          cargo build --release --target ${{ matrix.target }} --features cbinding

      - name: Verify exported library exists
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *windows*)
              test -f "target/${{ matrix.target }}/release/${LIB_NAME}.dll"
              ;;
            *apple*)
              test -f "target/${{ matrix.target }}/release/lib${LIB_NAME}.dylib"
              ;;
            *)
              test -f "target/${{ matrix.target }}/release/lib${LIB_NAME}.so"
              ;;
          esac